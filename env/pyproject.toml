[project]
name = "hpc-course"
version = "0.2.0"
description = "Authoring and validation environment for the Modern Parallel Programming in Python workshop (Colab edition)"
requires-python = ">=3.12"
# Students do not install this project. They run the notebooks in Google Colab,
# where the setup cell installs only what is listed in colab_requirements.txt.
# This project exists so that an author can regenerate the .ipynb files from the
# .py sources and execute every core notebook headless in CPU mode.
dependencies = [
    "numpy>=2.0",
    "numba>=0.61",
    "matplotlib>=3.9",
    "line-profiler>=4.2",
    "psutil>=6",
    "joblib>=1.4",
    "jupytext>=1.16",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
]

[project.optional-dependencies]
# Only for validating the GPU branch on an author machine with an NVIDIA GPU.
# Colab GPU runtimes ship CuPy preinstalled; the notebooks fall back to
# cupy-cuda12x only if the import fails there.
gpu = ["cupy-cuda12x>=13.4"]
